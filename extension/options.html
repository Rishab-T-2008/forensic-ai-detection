<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI / REAL Forensics Settings</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 20px;
      width: 320px;
      color: #17221c;
      background: #faf8f5;
      margin: 0;
    }
    h2 {
      font-size: 16px;
      margin-top: 0;
      margin-bottom: 12px;
      font-family: Georgia, serif;
      letter-spacing: 0.5px;
    }
    label {
      font-size: 12px;
      font-weight: 600;
      display: block;
      margin-bottom: 6px;
      color: #4a5c53;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input[type="url"] {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      font-size: 13px;
      border: 1px solid #cfd7cc;
      border-radius: 4px;
      margin-bottom: 14px;
      background: #fff;
    }
    button {
      background: #17221c;
      color: #fff;
      border: none;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
      width: 100%;
    }
    button:hover {
      background: #24352b;
    }
    .status {
      font-size: 12px;
      color: #2e7d32;
      margin-top: 8px;
      text-align: center;
      min-height: 16px;
    }
  </style>
</head>
<body>
  <h2>AI / REAL Settings</h2>
  <label for="apiUrl">Backend API URL</label>
  <input type="url" id="apiUrl" placeholder="http://localhost:8000">
  <button id="saveBtn">Save Settings</button>
  <div id="status" class="status"></div>
  <script src="options.js"></script>
</body>
</html>
